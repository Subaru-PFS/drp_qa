known_bad:
  # Run25 twilight sky taken through cloud. Unlike the SM1 entry above this is
  # an observing condition rather than an instrument fault, but the degraded
  # image quality is what QA should catch.
  - visitRange: [134334, 134337]
    arms: [b, r, n]
    spectrographs: [1, 2, 3, 4]
    seqType: "Twilight sky"
    expect: FAIL
    metric: medFwhm
    reason: "Cloudy; 180 s twilight sky taken through cloud."

  # Documented genuine optics failure: SM1 showed FWHM 3.83-4.86 px across all
  # lamp types over this visit range, independent of species, which rules out
  # the lamp-physics explanation that covers high b-arm flag rates elsewhere.
  # See AGENTS.md, "SM1 exception".
  - visitRange: [140005, 140138]
    arms: [b, r, n, m]
    spectrographs: [1]
    expect: FAIL
    metric: medFwhm
    reason: "SM1 focus/mirror alignment; FWHM 3.83-4.86 px across all lamp types."

  # TODO(PIPE2D-1391): find a visit reduced against an out-of-date
  # detectorMap_calib. This is the reference case for the Phase 2 drift
  # metrics: large drift against a stale calib must be attributed to the calib,
  # not to the instrument.
  - placeholder: true
    visit: null
    expect: WARN
    metric: medDxCenter
    reason: "Reduced against a stale detectorMap_calib; bulk spatial offset."

  # TODO(PIPE2D-1391): find a saturated frame if one exists in the archive.
  # This is the reference case for the Phase 3 real-saturation metric.
  - placeholder: true
    visit: null
    expect: FAIL
    metric: pctSaturatedPixels
    reason: "Saturated exposure; peak pixels flagged SAT."

  # ---- Run30 -------------------------------------------------------------
  # Frames taken with the light path obstructed. These are mis-taken frames
  # rather than instrument faults, but they must not pass: a QA gate that
  # greenlights a frame shot through a closed cover is not a gate.
  - visitRange: [150115, 150116]
    arms: [b, r, n]
    spectrographs: [1, 2, 3, 4]
    epoch: Run30
    expect: FAIL
    metric: pctFlagged
    reason: "M1 cover closed."
  - visitRange: [150641, 150642]
    arms: [b, r, n]
    spectrographs: [1, 2, 3, 4]
    epoch: Run30
    expect: FAIL
    metric: pctFlagged
    reason: "Mirror cover and top screen both closed; flagged at the telescope as to be ignored."
  - visit: 150661
    arms: [b, r, n]
    spectrographs: [1, 2, 3, 4]
    seqType: "Trace"
    epoch: Run30
    expect: FAIL
    reason: >-
      Mirror cover open but the screen in the wrong position. The metric that
      should catch it is not yet attributed -- deliberately left unnamed rather
      than guessed at.

  # Partial slit illumination: only one fiber group was lit, so most fibers
  # have no usable measurement. The defect is the count, not the shape.
  - visit: 149217
    arms: [b, m]
    spectrographs: [1, 2, 3, 4]
    seqType: "Trace"
    epoch: Run30
    expect: WARN
    metric: nLines
    reason: "Only group 2 was illuminated."
  - visit: 149398
