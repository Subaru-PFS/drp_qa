  # Off-zenith Helium DetectorMap tests bracketing a science exposure, at
  # altitude 45-49 and insrot 5-9 rather than at the zenith the calibration
  # was taken at. This is the flexure reference case: a real offset against
  # detectorMap_calib, which is what the Phase 2 drift metrics must detect and
  # attribute correctly. WARN rather than FAIL is provisional.
  - visit: 150779
    arms: [b, m, n]
    spectrographs: [1, 2, 3, 4]
    seqType: "DetectorMap test pre-exposure (Helium)"
    role: flexure
    epoch: Run30
    expect: WARN
    metric: medDxCenter
    reason: "Alt 45, az 54, insrot 9; flexure against a zenith-derived detectorMap_calib."
  - visit: 150782
