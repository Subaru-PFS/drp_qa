# Golden visit set for drp_qa
# =============================================================================
#
# A small, fixed list of visits with *known* verdicts. Every threshold and every
# new metric is validated against this set:
#
#   * a metric that flags a ``known_good`` visit does not merge;
#   * a metric that passes a ``known_bad`` visit does not merge.
#
# See doc/qa-rebuild-plan.md section 1.1. Load it with
# ``pfs.drp.qa.metrics.goldenVisits.loadGoldenVisits``, and derive thresholds
# from it with ``bin.src/calibrateQaThresholds.py``.
#
# Entry schema
# ------------
# Exactly one of:
#   visit:        int          a single visit
#   visitRange:   [first, last]  an inclusive range of visits
#
# Optional selectors (omitted means "every value"):
#   arms:           list of str, e.g. [b, r, n, m]
#   spectrographs:  list of int, e.g. [1, 2, 3, 4]
#   seqType:        str, the W_SEQNAM value, e.g. "Arc: HgCd"
#
# Verdict:
#   expect:   PASS | WARN | FAIL   (defaults to PASS in known_good, and is
#                                   required in known_bad)
#   metric:   str, optional. The metric whose name should identify the fault.
#             The full-rebuild acceptance criterion is that a known_bad visit
#             fails *for the expected reason*, not merely that it fails.
#   reason:   str, why this verdict is expected.
#   note:     str, free-form context.
#
# Bookkeeping:
#   placeholder: true   marks an entry that has not yet been filled in with a
#                       real visit number. Placeholders are excluded by the
#                       loader unless ``includePlaceholders=True`` is passed, so
#                       that an unfilled entry can never silently validate a
#                       threshold.
# =============================================================================

version: 1

known_good:
  # Run25, 2025-11-10/11. A stable calibration sequence at fixed pointing
  # (alt 90, az 90, insrot 0), taken as two blocks with different camera sets.
  # Supplied as the reference stable set; every threshold is derived from it.
  #
  # Block A -- b, r and n arms, spectrographs 1-4.
  - visitRange: [133025, 133027]
    arms: [b, r, n]
    spectrographs: [1, 2, 3, 4]
    seqType: "Arc: Argon"
    note: "Run25 stable set, block A. 10 s exposures."
  - visitRange: [133028, 133030]
    arms: [b, r, n]
    spectrographs: [1, 2, 3, 4]
    seqType: "Arc: Xenon"
    note: "Run25 stable set, block A. 45 s exposures."
  - visitRange: [133031, 133033]
    arms: [b, r, n]
    spectrographs: [1, 2, 3, 4]
    seqType: "Arc: Neon"
    note: "Run25 stable set, block A. 5 s exposures."
  - visitRange: [133034, 133036]
    arms: [b, r, n]
    spectrographs: [1, 2, 3, 4]
    seqType: "Arc: Krypton"
    note: "Run25 stable set, block A. 70 s exposures."
  - visitRange: [133037, 133039]
    arms: [b, r, n]
    spectrographs: [1, 2, 3, 4]
    seqType: "Arc: HgCd"
    note: >-
      Run25 stable set, block A. 45 s exposures. The only HgCd in the set, and
      so the only dense, well-measured b-arm coverage: b-arm flag rates here are
      genuine rather than lamp physics.
  - visitRange: [133040, 133041]
    arms: [b, r, n]
    spectrographs: [1, 2, 3, 4]
    seqType: "Trace"
    note: "Run25 stable set, block A. 20 s scienceTrace; exercises the fiber-profile path."

  # Block B -- b and m arms, spectrographs 1-4. No HgCd was taken in this block.
  - visitRange: [133042, 133044]
    arms: [b, m]
    spectrographs: [1, 2, 3, 4]
    seqType: "Arc: Argon"
    note: "Run25 stable set, block B. 10 s exposures."
  - visitRange: [133045, 133047]
    arms: [b, m]
    spectrographs: [1, 2, 3, 4]
    seqType: "Arc: Xenon"
    note: "Run25 stable set, block B. 45 s exposures."
  - visitRange: [133048, 133050]
    arms: [b, m]
    spectrographs: [1, 2, 3, 4]
    seqType: "Arc: Neon"
    note: "Run25 stable set, block B. 5 s exposures."
  - visitRange: [133051, 133053]
    arms: [b, m]
    spectrographs: [1, 2, 3, 4]
    seqType: "Arc: Krypton"
    note: "Run25 stable set, block B. 45 s exposures."
  - visitRange: [133054, 133055]
    arms: [b, m]
    spectrographs: [1, 2, 3, 4]
    seqType: "Trace"
    note: "Run25 stable set, block B. 20 s scienceTrace."

known_bad:
  # Documented genuine optics failure: SM1 showed FWHM 3.83-4.86 px across all
  # lamp types over this visit range, independent of species, which rules out
  # the lamp-physics explanation that covers high b-arm flag rates elsewhere.
  # See AGENTS.md, "SM1 exception".
  - visitRange: [140005, 140138]
    arms: [b, r, n, m]
    spectrographs: [1]
    expect: FAIL
    metric: medFwhm
    reason: "SM1 focus/mirror alignment; FWHM 3.83-4.86 px across all lamp types."

  # TODO(PIPE2D-1391): find a visit reduced against an out-of-date
  # detectorMap_calib. This is the reference case for the Phase 2 drift
  # metrics: large drift against a stale calib must be attributed to the calib,
  # not to the instrument.
  - placeholder: true
    visit: null
    expect: WARN
    metric: medDxCenter
    reason: "Reduced against a stale detectorMap_calib; bulk spatial offset."

  # TODO(PIPE2D-1391): find a saturated frame if one exists in the archive.
  # This is the reference case for the Phase 3 real-saturation metric.
  - placeholder: true
    visit: null
    expect: FAIL
    metric: pctSaturatedPixels
    reason: "Saturated exposure; peak pixels flagged SAT."
