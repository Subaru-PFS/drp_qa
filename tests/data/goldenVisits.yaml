    spectrographs: [1, 2, 3, 4]
    seqType: "DetectorMap test post-exposure (Helium)"
    role: flexure
    epoch: Run30
    expect: WARN
    metric: medDxCenter
    reason: "Alt 49, az 53, insrot 5; flexure against a zenith-derived detectorMap_calib."

