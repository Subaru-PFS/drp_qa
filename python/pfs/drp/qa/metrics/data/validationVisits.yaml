known_bad:
  # Run25 b-arm arcs of the faint and crowded lamps: most of their lines are
  # flagged, because adjustDetectorMap applies one S/N cut to all lines together.
  # The exposures are good for the other metrics (these entries hold only for
  # pctFlagged); the flag rate is a pipeline limitation under work in drp_stella.
  # Recorded as bad so that today's rates are the baseline a fix is measured
  # against, rather than becoming the threshold. HgCd is not listed: its b-arm
  # flags are genuine.
  - visitRange: [133025, 133027]
    sequenceType: scienceArc
    arms: [b]
    spectrographs: [1, 2, 3, 4]
    seqType: "Arc: Argon"
    expect: WARN
    metric: pctFlagged
    reason: "b-arm Argon (Run25 block A): most lines flagged by adjustDetectorMap's single S/N cut."
  - visitRange: [133028, 133030]
