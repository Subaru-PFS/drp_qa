# Validation visit set for drp_qa
# =============================================================================
#
# A small, fixed list of visits with *known* verdicts. Every threshold and every
# new metric is validated against this set:
#
#   * a metric that flags a ``known_good`` visit does not merge;
#   * a metric that passes a ``known_bad`` visit does not merge.
#
# See docs/qa-principles.md. Load it with
# ``pfs.drp.qa.metrics.validationVisits.loadValidationVisits``, and derive thresholds
# from it with ``bin.src/calibrateQaThresholds.py``.
#
# Runs
# ----
#   runs:           run number -> [first, last] visit, from each run's
#                   calibration summary. Every entry lies within one run.
#   referenceRuns:  the runs thresholds are derived from. Known-good visits of
#                   other runs are held out and compared against them.
#
# Entry schema
# ------------
# Exactly one of:
#   visit:        int          a single visit
#   visitRange:   [first, last]  an inclusive range of visits
#
# Required, except in a placeholder:
#   sequenceType: str  the IIC sequence type, one of scienceArc, scienceTrace,
#                      scienceObject. Not a selector: it decides how the visit
#                      is reduced, as drpActor reduces that type.
#
# Optional selectors (omitted means "every value"):
#   arms:           list of str, e.g. [b, r, n, m]
#   spectrographs:  list of int, e.g. [1, 2, 3, 4]
#   seqType:        str, the W_SEQNAM value, e.g. "Arc: HgCd"
#
# Sections:
#   known_good:  expected to PASS every metric.
#   known_bad:   expected to WARN or FAIL, for a stated reason.
#
# Every entry carries a verdict. That is the whole content of this file: a
# visit earns a place here because a metric that gets it wrong must not merge.
# Visits with no verdict do not belong -- a per-run calibration block, a nightly
# drift series, the inputs to a run-to-run comparison. Those are selected by
# querying the Butler on sequence type, lamp and date at the time the job runs,
# which stays correct for the next run without anyone editing this file.
#
# Verdict:
#   expect:   PASS | WARN | FAIL   (defaults to PASS in known_good, and is
#                                   required in known_bad)
#   metric:   str, optional. The metric whose name should identify the fault.
#             The full-rebuild acceptance criterion is that a known_bad visit
#             fails *for the expected reason*, not merely that it fails.
#   reason:   str, why this verdict is expected.
#   note:     str, free-form context.
#
# Bookkeeping:
#   unconfirmed: true   marks a verdict that is suspected but not established --
#                       a real visit, noted in the run's calibration summary, whose metrics
#                       nobody has checked. It is loaded and reported like any
#                       other entry, but it is excluded from the check that a
#                       threshold separates the known-bad data, because a guess
#                       that fails the build is worse than no entry at all.
#   placeholder: true   marks an entry that has not yet been filled in with a
#                       real visit number. Placeholders are excluded by the
#                       loader unless ``includePlaceholders=True`` is passed, so
#                       that an unfilled entry can never silently validate a
#                       threshold.
# =============================================================================

version: 1

# Run25 is the reference: its calibrations were made for it, and it is the most
# complete stable set. Run27 had no science and no calibrations of its own, so it
# was reduced against older ones and is suspect; Run30 is compared as well.
runs:
  25: [132657, 135850]
  27: [139870, 140871]
  30: [143087, 150896]
referenceRuns: [25]

