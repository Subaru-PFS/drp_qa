name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack-free:
    name: Stack-free tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml requires >=3.12. Keep the lowest supported version in
        # the matrix so we notice if something starts depending on a newer one.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The package itself is deliberately NOT installed.
      #
      # `pip install -e .` would pull pfs-utils (and transitively pfs-datamodel
      # and pfs-instdata) from GitHub, making every run depend on three other
      # repositories being reachable, for no gain. tests/conftest.py puts
      # `python/` on sys.path instead, so the stack-free suite imports
      # `pfs.drp.qa.*` straight from the checkout.
      #
      # The third-party packages below are ordinary PyPI wheels with no PFS
      # dependency. They are what the stack-free modules under
      # `pfs.drp.qa.metrics` and `pfs.drp.qa.plotting` need; nothing here pulls
      # in the LSST stack.
      #
      # Tests needing the LSST/PFS stack are skipped by tests/conftest.py.
      # See the stack-tests job below. tests/guiders is skipped too; it runs
      # in the guiders job.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pandas scipy matplotlib seaborn pyyaml

      - name: Run tests
        run: pytest -v

  guiders:
    name: Guiders tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # pfs-utils is installed with --no-deps: its declared dependencies pull
      # pfs-datamodel and pfs-instdata from git, which the guider code doesn't
      # use. The second list is drp_qa's own dependencies from pyproject.toml
      # (less pfs-utils), then what pfs.utils.database and
      # pfs.utils.coordinates import. Keep it in step with pyproject.toml.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps "pfs-utils @ git+https://github.com/Subaru-PFS/pfs_utils.git"
          python -m pip install numpy pandas matplotlib scipy seaborn \
            astropy astroplan sqlalchemy pyyaml pytest

      # drp_pfs_data at this branch's name if it has one, else master. LFS
      # smudging is skipped and only guiders/ is pulled, so the rest of the
      # checkout stays as LFS pointers.
      - name: Check out drp_pfs_data
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          URL: https://github.com/Subaru-PFS/drp_pfs_data.git
        run: |
          if git ls-remote --exit-code --heads "$URL" "refs/heads/$BRANCH" > /dev/null; then
            ref="$BRANCH"
          else
            status=$?
            [ "$status" -eq 2 ] || exit "$status"  # 2: no such branch; anything else is an error
            ref=master
          fi
          echo "Using drp_pfs_data branch $ref"
          dir="$RUNNER_TEMP/drp_pfs_data"
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --branch "$ref" "$URL" "$dir"
          git -C "$dir" lfs pull --include "guiders/**"
          echo "DRP_PFS_DATA_DIR=$dir" >> "$GITHUB_ENV"

      # As in the stack-free job, the package isn't installed. It is imported
      # from python/, where pfs and pfs.drp are namespace packages, so it
      # coexists with the installed pfs.utils.
      - name: Run tests
        env:
          PYTHONPATH: python
        run: pytest -v tests/guiders

  stack-tests:
    name: Stack tests (LSST/PFS)
    runs-on: ubuntu-latest
    # No stack container is available to this repository yet. When one is,
    # drop this guard and fill in the image and drp_stella location below.
    if: false
    container: "" # e.g. ghcr.io/<org>/pfs-stack:<tag>
    steps:
      - uses: actions/checkout@v4

      - name: Run tests with the stack
        run: |
          source /opt/lsst/software/stack/loadLSST.bash
          setup -r /path/to/drp_stella
          setup -r .
          pytest -v

# ---------------------------------------------------------------------------
# Why so little runs here
# ---------------------------------------------------------------------------
# Most of this package imports pfs.drp.stella, which is not pip-installable, so
# only the stack-free suite runs in CI today. The way to increase coverage is
# not a bigger CI image but more logic in pure functions that take arrays and
# DataFrames, which need no stack to test. See doc/qa-rebuild-plan.md.
