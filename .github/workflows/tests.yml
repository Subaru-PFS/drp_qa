name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack-free:
    name: Stack-free tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml requires >=3.12. Keep the lowest supported version in
        # the matrix so we notice if something starts depending on a newer one.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The package itself is deliberately NOT installed.
      #
      # The suite that can run here is stack-free and imports only the standard
      # library. `pip install -e .` would pull pfs-utils (and transitively
      # pfs-datamodel and pfs-instdata) from GitHub, making every run depend on
      # three other repositories being reachable, for no gain.
      #
      # Tests needing the LSST/PFS stack are skipped by tests/conftest.py.
      # See the stack-tests job below. So are the test directories needing
      # other packages (tests/conftest.py's _OPTIONAL_DIRS); they run in the
      # deps job.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run tests
        run: pytest -v

  deps:
    name: Stack-free tests with dependencies (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Every test that doesn't need the stack, including the directories the
      # stack-free job skips. pfs-utils is installed with --no-deps: its
      # declared dependencies pull pfs-datamodel and pfs-instdata from git,
      # which nothing tested here uses. The second list is drp_qa's own
      # dependencies from pyproject.toml (less pfs-utils), then what
      # pfs.utils.database and pfs.utils.coordinates import, then pyarrow,
      # for the tests' parquet files. Keep it in step with pyproject.toml.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps "pfs-utils @ git+https://github.com/Subaru-PFS/pfs_utils.git"
          python -m pip install numpy pandas matplotlib scipy seaborn \
            astropy astroplan sqlalchemy pyyaml pyarrow pytest

      # As in the stack-free job, the package isn't installed. It is imported
      # from python/, where pfs and pfs.drp are namespace packages, so it
      # coexists with the installed pfs.utils.
      - name: Run tests
        env:
          PYTHONPATH: python
        run: pytest -v

  stack-tests:
    name: Stack tests (LSST/PFS)
    runs-on: ubuntu-latest
    # No stack container is available to this repository yet. When one is,
    # drop this guard and fill in the image and drp_stella location below.
    if: false
    container: "" # e.g. ghcr.io/<org>/pfs-stack:<tag>
    steps:
      - uses: actions/checkout@v4

      - name: Run tests with the stack
        run: |
          source /opt/lsst/software/stack/loadLSST.bash
          setup -r /path/to/drp_stella
          setup -r .
          pytest -v

# ---------------------------------------------------------------------------
# Why so little runs here
# ---------------------------------------------------------------------------
# Most of this package imports pfs.drp.stella, which is not pip-installable, so
# only the stack-free suite runs in CI today. The way to increase coverage is
# not a bigger CI image but more logic in pure functions that take arrays and
# DataFrames, which need no stack to test. See doc/qa-rebuild-plan.md.
