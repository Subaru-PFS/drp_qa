description: >-
  Reduce visits from raw data and measure them: the visits of a run in comparison mode
  (bin.src/qaComparison.py), which reuses drpActor's reductions where they exist, and the
  visits a candidate calibration is validated on (drpQa.py calib validate). The reduction is
  drp_stella's reduceExposure, as drpActor runs it; the caller applies drpActor's
  per-sequence-type config overrides. The QA is imageQualityQa and dmLineResiduals, the line
  residuals against detectorMap_calib and the visit's detectorMap. Neither gives a verdict:
  that is given when the numbers are loaded into qadb (drpQa.py load).
instrument: lsst.obs.pfs.PrimeFocusSpectrograph
imports:
  - location: $DRP_STELLA_DIR/pipelines/reduceExposure.yaml
    exclude:
      - mergeArms
  - location: $DRP_QA_DIR/pipelines/drpQA.yaml
    include:
      - imageQualityQa
      - dmLineResiduals
