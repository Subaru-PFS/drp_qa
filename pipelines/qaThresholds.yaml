description: >-
  Reduce visits from raw data and measure their image quality: the validation visits, for
  deriving QA thresholds (docs/qa-thresholds.ipynb), and the visits of a run in comparison
  mode (bin.src/qaComparison.py), which reuses drpActor's reductions where they exist. The
  reduction is drp_stella's reduceExposure, as drpActor runs it; the caller applies drpActor's
  per-sequence-type config overrides.
instrument: lsst.obs.pfs.PrimeFocusSpectrograph
imports:
  - location: $DRP_STELLA_DIR/pipelines/reduceExposure.yaml
    exclude:
      - mergeArms
  - location: $DRP_QA_DIR/pipelines/drpQA.yaml
    include:
      - imageQualityQa
